<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>型号报价管理系统</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #666;
      --line: #e5e5e5;
      --bg: #fafaf8;
      --card: #fff;
      --danger: #c0392b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    header {
      padding: 20px 28px;
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    main { padding: 24px 28px; max-width: 1400px; margin: 0 auto; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }
    input, select, textarea {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      background: var(--card);
    }
    button.primary {
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
    }
    button.ghost {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
    }
    button.danger { color: var(--danger); border-color: #f0c4c0; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      text-align: left;
    }
    th { background: #f3f3f0; font-weight: 500; color: var(--muted); white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: #f7f7f4; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    /* 保持 td 为 table-cell，flex 放在内层，避免行下划线错位 */
    td.actions {
      white-space: nowrap;
    }
    td.actions .btn-row {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      align-items: center;
    }
    td.actions button { flex-shrink: 0; }
    .muted { color: var(--muted); font-size: 12px; }
    .no-quote { color: #bbb; }
    .model-link {
      color: var(--ink);
      font-weight: 500;
      text-decoration: underline;
      text-decoration-color: #ccc;
      text-underline-offset: 3px;
      cursor: pointer;
    }
    .model-link:hover { text-decoration-color: var(--ink); }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      width: min(560px, 92vw);
      max-height: 86vh;
      overflow: auto;
      border: 1px solid var(--line);
    }
    /* 历史报价列多，给到更宽一档，避免时间/金额挤到换行 */
    #history-modal .modal { width: min(980px, 96vw); }
    .nowrap { white-space: nowrap; }
    .modal h3 { margin: 0 0 4px; font-size: 16px; }
    .modal .sub { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .field input, .field select, .field textarea { width: 100%; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .history-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      margin: 8px 0 4px;
    }
    .history-table th, .history-table td {
      padding: 8px 10px;
      font-size: 12px;
      border-bottom: 1px solid var(--line);
    }
    .history-table th { background: #f3f3f0; color: var(--muted); font-weight: 500; }
    .history-table tr:last-child td { border-bottom: none; }
    .latest-tag {
      display: inline-block;
      background: var(--ink);
      color: #fff;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 4px;
      vertical-align: middle;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--ink);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .toast.show { opacity: 1; }
    .empty { padding: 32px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
<header style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px">
  <div>
    <h1>型号报价管理系统</h1>
    <p>列表显示最新报价 · 点击型号查看历史报价</p>
  </div>
  <div style="text-align:right">
    <div class="muted" style="font-size:11px">今日美元汇率</div>
    <div id="today-rate" style="font-size:20px;font-weight:600;font-variant-numeric:tabular-nums">—</div>
    <div class="muted" style="font-size:11px">1 USD = <span id="today-rate-detail">—</span> CNY</div>
  </div>
</header>

<main>
  <div class="toolbar">
    <select id="q-brand" style="width:150px">
      <option value="">全部品牌</option>
    </select>
    <input id="q-model" placeholder="型号筛选" style="width:160px" />
    <button class="ghost" onclick="loadProducts()">查询</button>
    <button class="ghost" onclick="exportCsv()">导出 CSV</button>
    <button class="ghost" onclick="document.getElementById('import-file').click()">导入 Excel</button>
    <input type="file" id="import-file" accept=".xlsx,.xls" style="display:none"
           onchange="importExcel(this)" />
    <button class="primary" onclick="openProductModal()">+ 新增产品</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>品牌</th>
        <th>型号</th>
        <th class="num">需求数量</th>
        <th class="num">采购价</th>
        <th class="num">报价</th>
        <th class="num">报价(USD)</th>
        <th class="num">报价总额(USD)</th>
        <th>报价时间</th>
        <th style="width:190px">操作</th>
        <th>备注</th>
      </tr>
    </thead>
    <tbody id="product-body"></tbody>
  </table>
  <div class="toolbar" style="margin-top:12px">
    <span class="muted">每页行数</span>
    <select id="page-size" style="width:80px" onchange="changePageSize()">
      <option value="50">50</option>
      <option value="100">100</option>
      <option value="200">200</option>
    </select>
    <button class="ghost" onclick="pageProducts(-1)">上一页</button>
    <span class="muted" id="product-page-info">第 1 页</span>
    <button class="ghost" onclick="pageProducts(1)">下一页</button>
  </div>
</main>

<!-- 产品编辑弹窗 -->
<div class="modal-backdrop" id="product-modal">
  <div class="modal">
    <h3 id="product-modal-title">新增产品</h3>
    <p class="sub" id="product-modal-sub">价格为可选：填写则顺带记录第一条报价；后续可在「报价」里追加</p>
    <div class="field"><label>品牌（可空）</label><input id="p-brand" /></div>
    <div class="field"><label>型号 *</label><input id="p-model" /></div>
    <div class="field"><label>备注（规格等）</label><input id="p-remark" /></div>
    <div class="field"><label>采购价（可选）</label><input id="p-purchase-price" type="number" step="0.01" min="0" /></div>
    <div class="field"><label>报价（可选）</label><input id="p-quote-price" type="number" step="0.01" min="0" /></div>
    <div class="field"><label>需求数量（可选）</label><input id="p-quantity" type="number" min="0" step="1" /></div>
    <div class="field"><label>报价时间（可选，默认当前）</label><input id="p-quote-time" type="datetime-local" /></div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal('product-modal')">取消</button>
      <button class="primary" onclick="saveProduct()">保存</button>
    </div>
  </div>
</div>

<!-- 历史报价弹窗 -->
<div class="modal-backdrop" id="history-modal">
  <div class="modal">
    <h3 id="history-title">历史报价</h3>
    <p class="sub" id="history-sub"></p>
    <table class="history-table">
      <thead>
        <tr>
          <th>采购价</th>
          <th>报价</th>
          <th>数量</th>
          <th>报价(USD)</th>
          <th>总额(USD)</th>
          <th>报价时间</th>
          <th>备注</th>
          <th style="width:70px"></th>
        </tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal('history-modal')">关闭</button>
      <button class="primary" onclick="openQuoteForm()">+ 录入新报价</button>
    </div>
  </div>
</div>

<!-- 录入报价弹窗 -->
<div class="modal-backdrop" id="quote-modal">
  <div class="modal">
    <h3 id="quote-modal-title">录入报价</h3>
    <p class="sub" id="quote-sub"></p>
    <div class="field"><label>采购价 *</label><input id="f-purchase-price" type="number" step="0.01" /></div>
    <div class="field"><label>报价 *</label><input id="f-quote-price" type="number" step="0.01" /></div>
    <div class="field"><label>需求数量</label><input id="f-quantity" type="number" min="0" step="1" /></div>
    <div class="field"><label>报价时间</label><input id="f-quote-time" type="datetime-local" /></div>
    <div class="field"><label>备注</label><textarea id="f-remark" rows="2"></textarea></div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal('quote-modal')">取消</button>
      <button class="primary" onclick="saveQuote()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const api = {
    async get(url) {
      return (await fetch(url)).json();
    },
    async send(url, method, body) {
      return (await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined,
      })).json();
    }
  };

  let productPage = 1;
  let productPageSize = 50;
  let editingProductId = null;
  let currentProductId = null;
  let currentProductLabel = '';
  let editingQuoteId = null;
  const productCache = {};

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = (msg == null || msg === '') ? '操作失败，请重试' : String(msg);
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  /** 加载品牌下拉选项（保留当前选中值） */
  async function loadBrands() {
    const select = document.getElementById('q-brand');
    const current = select.value;
    const r = await api.get('/api/products/brands');
    if (r.code !== 0) { toast(r.message || '操作失败'); return; }
    const brands = r.data || [];
    select.innerHTML = '<option value="">全部品牌</option>'
      + brands.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('');
    if (current && brands.includes(current)) {
      select.value = current;
    }
  }

  function pageProducts(delta) {
    const next = productPage + delta;
    if (next < 1) return;
    productPage = next;
    loadProducts();
  }

  /** 切换每页行数：回到第 1 页后重载，避免落在空白页 */
  function changePageSize() {
    productPageSize = Number(document.getElementById('page-size').value);
    productPage = 1;
    loadProducts();
  }

  /** 批量导入 Excel：一行=型号+报价，时间取导入时刻 */
  async function importExcel(input) {
    const file = input.files[0];
    input.value = '';
    if (!file) return;
    const form = new FormData();
    form.append('file', file);
    try {
      const res = await fetch('/api/products/import', { method: 'POST', body: form });
      const r = await res.json();
      if (r.code !== 0) {
        toast(r.message || '导入失败');
        return;
      }
      const d = r.data || {};
      let msg = `导入完成：新建产品 ${d.productsCreated ?? 0}，匹配已有 ${d.productsMatched ?? 0}，新增报价 ${d.quotesCreated ?? 0}`;
      if (d.errors && d.errors.length) {
        msg += `；${d.errors.length} 行有问题`;
        console.warn('导入行错误', d.errors);
      }
      toast(msg);
      loadBrands();
      loadProducts();
    } catch (e) {
      toast('导入失败：' + (e && e.message ? e.message : '未知错误'));
    }
  }

  /** 按当前筛选条件导出 CSV（浏览器直接下载） */
  function exportCsv() {
    const brand = document.getElementById('q-brand').value.trim();
    const model = document.getElementById('q-model').value.trim();
    let url = '/api/products/export?';
    if (brand) url += `brand=${encodeURIComponent(brand)}&`;
    if (model) url += `model=${encodeURIComponent(model)}&`;
    window.location.href = url;
  }

  async function loadProducts() {
    const brand = document.getElementById('q-brand').value.trim();
    const model = document.getElementById('q-model').value.trim();
    let url = `/api/products?pageNo=${productPage}&pageSize=${productPageSize}`;
    if (brand) url += `&brand=${encodeURIComponent(brand)}`;
    if (model) url += `&model=${encodeURIComponent(model)}`;
    const r = await api.get(url);
    if (r.code !== 0) { toast(r.message || '操作失败'); return; }
    const page = r.data;
    const rows = page.records || [];
    document.getElementById('product-page-info').textContent = `第 ${page.current} 页 · 共 ${page.total} 条`;
    const body = document.getElementById('product-body');
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="10" class="empty">暂无数据</td></tr>';
      return;
    }
    rows.forEach(p => { productCache[p.id] = p; });
    body.innerHTML = rows.map(p => {
      const hasQuote = p.purchasePrice != null;
      const hasQty = p.quantity != null;
      return `
      <tr class="clickable" onclick="openHistory(${p.id})">
        <td>${esc(p.brand)}</td>
        <td><span class="model-link">${esc(p.model)}</span></td>
        <td class="num ${hasQty ? '' : 'no-quote'}">${hasQty ? p.quantity : '—'}</td>
        <td class="num ${hasQuote ? '' : 'no-quote'}">${hasQuote ? Number(p.purchasePrice).toFixed(2) : '—'}</td>
        <td class="num ${hasQuote ? '' : 'no-quote'}">${hasQuote ? Number(p.quotePrice).toFixed(2) : '—'}</td>
        <td class="num ${p.quoteUsd != null ? '' : 'no-quote'}">${p.quoteUsd != null ? Number(p.quoteUsd).toFixed(2) : '—'}</td>
        <td class="num ${p.quoteTotalUsd != null ? '' : 'no-quote'}">${p.quoteTotalUsd != null ? Number(p.quoteTotalUsd).toFixed(2) : '—'}</td>
        <td class="muted nowrap">${hasQuote ? fmtTime(p.quoteTime) : '暂无报价'}</td>
        <td class="actions">
          <div class="btn-row">
            <button class="ghost" onclick="event.stopPropagation(); openHistory(${p.id})">报价</button>
            <button class="ghost" onclick="event.stopPropagation(); editProduct(${p.id})">编辑</button>
            <button class="ghost danger" onclick="event.stopPropagation(); deleteProduct(${p.id})">删除</button>
          </div>
        </td>
        <td class="muted">${esc(p.remark || '')}</td>
      </tr>`;
    }).join('');
  }

  function openProductModal() {
    editingProductId = null;
    document.getElementById('product-modal-title').textContent = '新增产品';
    document.getElementById('product-modal-sub').textContent =
      '价格为可选：填写则顺带记录第一条报价；后续可在「报价」里追加';
    document.getElementById('p-brand').value = '';
    document.getElementById('p-model').value = '';
    document.getElementById('p-remark').value = '';
    document.getElementById('p-purchase-price').value = '';
    document.getElementById('p-quote-price').value = '';
    document.getElementById('p-quantity').value = '';
    document.getElementById('p-quote-time').value = nowForDateTimeLocal();
    document.getElementById('product-modal').classList.add('open');
  }

  function editProduct(id) {
    const p = productCache[id];
    if (!p) { toast('数据未加载'); return; }
    editingProductId = id;
    document.getElementById('product-modal-title').textContent = `编辑产品 #${id}`;
    document.getElementById('product-modal-sub').textContent =
      '已带入最新报价；保存后直接更新该条报价（不会新增历史），时间记为当前';
    document.getElementById('p-brand').value = p.brand || '';
    document.getElementById('p-model').value = p.model || '';
    document.getElementById('p-remark').value = p.remark || '';
    // 预填最新报价，避免只改数量时价格被清空
    document.getElementById('p-purchase-price').value =
      p.purchasePrice != null ? p.purchasePrice : '';
    document.getElementById('p-quote-price').value =
      p.quotePrice != null ? p.quotePrice : '';
    document.getElementById('p-quantity').value =
      p.quantity != null ? p.quantity : '';
    // 编辑时刻即本次报价时间
    document.getElementById('p-quote-time').value = nowForDateTimeLocal();
    document.getElementById('product-modal').classList.add('open');
  }

  async function saveProduct() {
    const body = {
      brand: document.getElementById('p-brand').value,
      model: document.getElementById('p-model').value,
      remark: document.getElementById('p-remark').value,
    };
    const purchaseVal = document.getElementById('p-purchase-price').value;
    const quoteVal = document.getElementById('p-quote-price').value;
    const qtyVal = document.getElementById('p-quantity').value;
    const timeVal = document.getElementById('p-quote-time').value;
    if (purchaseVal !== '') body.purchasePrice = Number(purchaseVal);
    if (quoteVal !== '') body.quotePrice = Number(quoteVal);
    if (qtyVal !== '') body.quantity = Number(qtyVal);
    if (timeVal) body.quoteTime = timeVal + ':00';
    const r = editingProductId
      ? await api.send(`/api/products/${editingProductId}`, 'PUT', body)
      : await api.send('/api/products', 'POST', body);
    if (r.code !== 0) { toast(r.message || '操作失败'); return; }
    closeModal('product-modal');
    toast(editingProductId ? '产品与最新报价已更新' : '产品已创建');
    loadBrands();
    loadProducts();
  }

  async function deleteProduct(id) {
    const p = productCache[id];
    const label = p ? `${p.brand} ${p.model}` : `#${id}`;
    if (!confirm(`确认删除「${label}」？\n它的全部历史报价会一并删除，且不可恢复。`)) return;
    const r = await api.send(`/api/products/${id}`, 'DELETE');
    if (r.code !== 0) { toast(r.message || '操作失败'); return; }
    toast('已删除');
    loadProducts();
  }

  async function openHistory(productId) {
    const p = productCache[productId];
    currentProductId = productId;
    currentProductLabel = p ? `${p.brand} / ${p.model}` : `产品 #${productId}`;
    document.getElementById('history-title').textContent = '历史报价';
    document.getElementById('history-sub').textContent = currentProductLabel;
    document.getElementById('history-body').innerHTML = '<tr><td colspan="8" class="empty">加载中…</td></tr>';
    document.getElementById('history-modal').classList.add('open');

    const r = await api.get(`/api/quotes?pageNo=1&pageSize=100&productId=${productId}`);
    if (r.code !== 0) {
      document.getElementById('history-body').innerHTML = `<tr><td colspan="8" class="empty">${esc(r.message)}</td></tr>`;
      return;
    }
    const rows = r.data.records || [];
    if (!rows.length) {
      document.getElementById('history-body').innerHTML = '<tr><td colspan="8" class="empty">暂无报价，点击下方「录入新报价」</td></tr>';
      return;
    }
    // 已按报价时间倒序（服务端），第一条为最新
    document.getElementById('history-body').innerHTML = rows.map((q, idx) => `
      <tr>
        <td class="num">${Number(q.purchasePrice).toFixed(2)}</td>
        <td class="num">${Number(q.quotePrice).toFixed(2)}</td>
        <td class="num">${q.quantity != null ? q.quantity : '—'}</td>
        <td class="num">${q.quoteUsd != null ? Number(q.quoteUsd).toFixed(2) : '—'}</td>
        <td class="num">${q.quoteTotalUsd != null ? Number(q.quoteTotalUsd).toFixed(2) : '—'}</td>
        <td class="muted nowrap">${fmtTime(q.quoteTime)}${idx === 0 ? '<span class="latest-tag">最新</span>' : ''}</td>
        <td>${esc(q.remark || '')}</td>
        <td>
          <button class="ghost danger" onclick="deleteQuote(${q.id})">删除</button>
        </td>
      </tr>`).join('');
  }

  function openQuoteForm() {
    editingQuoteId = null;
    document.getElementById('quote-modal-title').textContent = '录入报价';
    document.getElementById('quote-sub').textContent = currentProductLabel;
    document.getElementById('f-purchase-price').value = '';
    document.getElementById('f-quote-price').value = '';
    document.getElementById('f-quantity').value = '';
    // 默认报价时间为打开弹窗的当前时刻，格式适配 datetime-local
    document.getElementById('f-quote-time').value = nowForDateTimeLocal();
    document.getElementById('f-remark').value = '';
    document.getElementById('quote-modal').classList.add('open');
  }

  function nowForDateTimeLocal() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  async function saveQuote() {
    const timeVal = document.getElementById('f-quote-time').value;
    const qtyVal = document.getElementById('f-quantity').value;
    const body = {
      productId: currentProductId,
      purchasePrice: Number(document.getElementById('f-purchase-price').value),
      quotePrice: Number(document.getElementById('f-quote-price').value),
      quantity: qtyVal === '' ? null : Number(qtyVal),
      quoteTime: timeVal ? timeVal + ':00' : null,
      remark: document.getElementById('f-remark').value,
    };
    const r = await api.send('/api/quotes', 'POST', body);
    if (r.code !== 0) { toast(r.message || '操作失败'); return; }
    closeModal('quote-modal');
    toast('报价已保存');
    openHistory(currentProductId);
    loadProducts();
  }

  async function deleteQuote(id) {
    if (!confirm(`确认删除报价记录 #${id}？`)) return;
    const r = await api.send(`/api/quotes/${id}`, 'DELETE');
    if (r.code !== 0) { toast(r.message || '操作失败'); return; }
    toast('已删除');
    openHistory(currentProductId);
    loadProducts();
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function fmtTime(t) {
    return t ? String(t).replace('T', ' ').slice(0, 19) : '';
  }

  async function loadTodayRate() {
    const r = await api.get('/api/rates/today');
    if (r.code !== 0) {
      document.getElementById('today-rate').textContent = '获取失败';
      return;
    }
    // 加粗：业务汇率 1 位小数；灰色小字：精确汇率 3 位小数
    const used = Number(r.data.rateUsed).toFixed(1);
    const precise = Number(r.data.rateDisplay).toFixed(3);
    document.getElementById('today-rate').textContent = used + ' CNY';
    document.getElementById('today-rate-detail').textContent = precise;
  }

  loadTodayRate();
  loadBrands().then(loadProducts);
</script>
</body>
</html>
